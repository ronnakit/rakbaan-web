<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>รักบ้าน@CNX — จอลูกค้า (Senior-First & Frameless Clean UI)</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Senior-First & Frameless Clean Design Tokens matching Flutter rakbaan_page1 */
      :root {
        --navy-900: #0f172a;
        --navy-800: #1e293b;
        --navy-700: #334155;
        --navy-100: #e2e8f0;
        --navy-50: #f1f5f9;
        --mint-700: #059669;
        --mint-600: #10b981;
        --mint-100: #d1fae5;
        --mint-50: #f0fdf4;
        --gold-600: #d97706;
        --gold-500: #f59e0b;
        --gold-100: #fef3c7;
        --danger-600: #dc2626;
        --danger-50: #fef2f2;
        --pure-white: #ffffff;
      }

      body {
        background-color: #f1f5f9;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", Helvetica, Arial, sans-serif;
        color: var(--navy-900);
        -webkit-tap-highlight-color: transparent;
      }

      .mobile-frame {
        max-width: 540px;
        margin: 0 auto;
        min-height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 25px rgba(15, 23, 42, 0.08);
        position: relative;
      }

      /* Role Switcher Pill */
      .role-nav-banner {
        background: var(--navy-900);
        color: #e2e8f0;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .role-nav-banner a {
        color: #38bdf8;
        text-decoration: none;
        margin-left: 8px;
        font-weight: 600;
      }

      /* RakBaan App Bar (Matching RakBaanAppBar in Flutter) */
      .app-header {
        background: #ffffff;
        padding: 14px 18px;
        border-bottom: 1px solid var(--navy-100);
        position: sticky;
        top: 0;
        z-index: 90;
      }
      .app-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .app-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-brand-logo {
        font-size: 28px;
        line-height: 1;
      }
      .app-brand-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--navy-900);
        letter-spacing: -0.3px;
      }
      .app-brand-sub {
        font-size: 13px;
        color: #64748b;
        margin-top: 1px;
      }

      /* Navigation Bar (Tabs) */
      .tab-bar {
        display: flex;
        background: #ffffff;
        border-bottom: 2px solid var(--navy-100);
        position: sticky;
        top: 67px;
        z-index: 80;
      }
      .tab-btn {
        flex: 1;
        padding: 12px 6px;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        font-size: 16px;
        font-weight: 600;
        color: #64748b;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transition: all 0.2s;
      }
      .tab-btn.active {
        color: var(--mint-700);
        border-bottom-color: var(--mint-700);
        font-weight: 700;
        background: var(--mint-50);
      }

      /* Main Scroll Area */
      .main-body {
        flex: 1;
        padding: 16px 16px 80px;
      }

      /* Welcome Greeting (Navy50 & Navy900 bold 20pt) */
      .welcome-card {
        background: var(--navy-50);
        border: 1.5px solid var(--navy-100);
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .welcome-text {
        font-size: 20px;
        font-weight: 800;
        color: var(--navy-900);
      }

      /* Step Light Bar (Matching _buildStepLightBar in Flutter home_screen.dart) */
      .step-light-container {
        background: #ffffff;
        border: 2px solid var(--gold-500);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
        box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
      }
      .step-light-bar {
        background: var(--navy-50);
        border-radius: 10px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0 16px;
      }
      .step-node {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
      }
      .step-circle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e2e8f0;
        color: #475569;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        transition: all 0.3s;
      }
      .step-node.active .step-circle {
        background: var(--mint-700);
        color: #ffffff;
        box-shadow: 0 0 10px rgba(5, 150, 105, 0.6);
        transform: scale(1.15);
      }
      .step-node.active {
        color: var(--mint-700);
        font-weight: 800;
      }
      .step-node.passed .step-circle {
        background: #10b981;
        color: #ffffff;
      }
      .step-line {
        flex: 1;
        height: 3px;
        background: #cbd5e1;
        margin: 0 6px;
        margin-bottom: 18px;
      }
      .step-line.passed {
        background: #10b981;
      }

      /* Hero Banner */
      .hero-banner {
        background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
        color: #ffffff;
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 22px;
      }
      .hero-banner-title {
        font-size: 19px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .hero-banner-desc {
        font-size: 15px;
        opacity: 0.95;
        line-height: 1.4;
      }

      /* 4 Pillar Service Grid (แอร์, ประปา, ไฟฟ้า, หลังคา) */
      .pillar-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }
      .pillar-card {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 14px;
        padding: 16px 14px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .pillar-card:hover, .pillar-card:active {
        border-color: var(--mint-600);
        background: var(--mint-50);
        transform: translateY(-2px);
      }
      .pillar-icon {
        font-size: 36px;
        margin-bottom: 6px;
      }
      .pillar-name {
        font-size: 18px;
        font-weight: 700;
        color: var(--navy-900);
      }
      .pillar-sub {
        font-size: 13px;
        color: #64748b;
        margin-top: 2px;
      }

      /* 3-Step Wizard Stepper (REPAIR_WORKFLOW_3_STEPS.md) */
      .stepper-header {
        display: flex;
        background: var(--navy-50);
        border-radius: 12px;
        padding: 6px;
        margin-bottom: 18px;
      }
      .step-pill {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
      }
      .step-pill.active {
        background: #ffffff;
        color: var(--mint-700);
        font-weight: 800;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      }

      /* Tap-to-Talk Mic Button (96x96, Red Pulse) */
      .mic-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px;
        background: #f8fafc;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 1px solid #e2e8f0;
      }
      .mic-btn-large {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        border: none;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(220, 38, 38, 0.35);
        transition: all 0.25s;
        outline: none;
      }
      .mic-btn-large.listening {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        animation: pulseAnimation 1.2s infinite ease-in-out;
      }
      @keyframes pulseAnimation {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
        70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
      }
      .mic-status-label {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 700;
        color: #991b1b;
      }
      .mic-hint {
        font-size: 14px;
        color: #64748b;
        margin-top: 4px;
        text-align: center;
      }

      /* Smart Service Card (Senior-First & Frameless Clean UI) */
      .smart-service-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .smart-service-card.selected {
        border-color: var(--mint-600);
        background: var(--mint-50);
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.12);
      }
      .service-title {
        font-size: 19px;
        font-weight: 700;
        color: var(--navy-900);
      }
      .service-price {
        font-size: 22px;
        font-weight: 800;
        color: var(--mint-700);
      }

      /* Multi-Task Work Order Table (6 Columns per Senior-First rule) */
      .multi-task-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
        margin: 12px 0;
      }
      .multi-task-table th {
        background: var(--navy-50);
        color: var(--navy-800);
        padding: 10px 6px;
        text-align: center;
        border-bottom: 2px solid #cbd5e1;
        font-weight: 700;
      }
      .multi-task-table td {
        padding: 10px 6px;
        border-bottom: 1px solid #e2e8f0;
        text-align: center;
      }
      .multi-task-table td.text-left {
        text-align: left;
      }

      /* Frameless Price Summary */
      .frameless-price-box {
        padding: 16px 0;
        margin: 16px 0;
        border-top: 2px dashed #cbd5e1;
        border-bottom: 2px dashed #cbd5e1;
      }
      .grand-total-amount {
        font-size: 28px;
        font-weight: 800;
        color: var(--mint-700);
      }

      /* Big Senior Buttons */
      .btn-senior-primary {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
      }
      .btn-senior-primary:active {
        transform: scale(0.99);
      }
      .btn-senior-secondary {
        width: 100%;
        padding: 14px;
        background: #f1f5f9;
        color: var(--navy-800);
        font-size: 18px;
        font-weight: 600;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 10px;
      }

      /* SLA Urgency Radio Cards */
      .sla-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .sla-card.selected {
        border-color: var(--gold-600);
        background: var(--gold-100);
      }

      /* Location / GPS Tag */
      .gps-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #dcfce7;
        color: #166534;
        font-size: 14px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 8px;
        margin-top: 4px;
      }

      /* In-App Emergency Message Card & Quick Replies */
      .in-app-msg-card {
        background: #f0f9ff;
        border: 2px solid #0284c7;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.12);
      }
      .in-app-msg-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .in-app-msg-title {
        font-size: 17px;
        font-weight: 800;
        color: #0369a1;
      }
      .in-app-msg-bubble {
        background: #ffffff;
        border: 1px solid #bae6fd;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 16px;
        color: #0f172a;
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .btn-quick-reply {
        background: #ffffff;
        border: 1.5px solid #0284c7;
        color: #0284c7;
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-quick-reply:hover, .btn-quick-reply:active {
        background: #0284c7;
        color: #ffffff;
      }
      .in-app-reply-box {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .in-app-reply-input {
        flex: 1;
        padding: 12px 14px;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
      }
      .in-app-reply-input:focus {
        border-color: #0284c7;
      }
    </style>
  </head>
  <body>
    <div class="mobile-frame">
      <!-- Role Switcher Banner -->
      <div class="role-nav-banner">
        <span>👤 <strong>จอส่วนลูกค้า (Customer)</strong></span>
        <div>
          <span>สลับจอ:</span>
          <a href="/tech.html">🔧 จอช่าง</a>
          <a href="/">🏛️ จอเรา Ops</a>
        </div>
      </div>

      <!-- App Header -->
      <header class="app-header">
        <div class="app-header-top">
          <div class="app-brand">
            <span class="app-brand-logo">🏡</span>
            <div>
              <div class="app-brand-title">รักบ้าน@CNX</div>
              <div class="app-brand-sub">Chiang Mai Trusted Home Care · Ver 1.2.5</div>
            </div>
          </div>
          <div style="font-size: 12px; color: #059669; font-weight: 700; text-align: right;">
            เชียงใหม่<br /><span style="font-size: 11px; color: #64748b;">(สามกษัตริย์)</span>
          </div>
        </div>
      </header>

      <!-- Tab Navigation -->
      <nav class="tab-bar">
        <button class="tab-btn active" id="tab-home">
          <span>🏠</span>
          <span>หน้าแรก</span>
        </button>
        <button class="tab-btn" id="tab-book">
          <span>🛠️</span>
          <span>แจ้งซ่อม 3 ขั้น</span>
        </button>
        <button class="tab-btn" id="tab-tracking">
          <span>📍</span>
          <span>ติดตามงาน</span>
        </button>
      </nav>

      <!-- Main Container -->
      <main class="main-body" id="customer-view-root">
        <!-- Content will be rendered dynamically by customer.js -->
        <div style="text-align: center; padding: 50px 0; color: #64748b;">กำลังโหลดข้อมูล...</div>
      </main>

      <!-- Footer -->
      <footer style="text-align: center; padding: 20px 10px 40px; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0;">
        <div style="font-weight: 700; color: #334155;">รักบ้าน@CNX · บริษัท เพียบพร้อมทำ จำกัด</div>
        <div style="font-size: 12px; margin-top: 4px;">สังคมผู้สูงอายุ สบายตา ใช้งานง่าย (Senior-First & Frameless Clean UI)</div>
      </footer>
    </div>

    <!-- Script Entrypoint -->
    <script type="module" src="/src/customer.js?v=1.2.5"></script>
  </body>
</html>
