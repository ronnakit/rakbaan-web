<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>รักบ้าน@CNX — จอลูกค้า</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080c14;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .mobile-frame {
        width: 100%;
        max-width: 430px;
        height: 100%;
        background: #ffffff;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="mobile-frame">
      <iframe src="http://localhost:8080/"></iframe>
    </div>
  </body>
</html>
