<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>รักบ้าน@CNX — จอช่างมืออาชีพ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
      /* ==========================================================================
         ธีมเฉพาะช่างมืออาชีพ (Safety Artisan Orange & Slate Navy)
         กติกากลาง: อากงอาม่า ตัวหนังสือใหญ่ ภาษาไทยล้วน ไม่ฟุ่มเฟือย ไม่ซ้ำสีลูกค้า
         ========================================================================== */
      :root {
        --tech-primary: #ea580c;       /* ส้มช่าง (Safety Artisan Orange) */
        --tech-primary-dark: #c2410c;  /* ส้มเข้มเมื่อกด */
        --tech-primary-light: #fff7ed; /* ส้มอ่อนพื้นหลัง */
        --tech-primary-border: #fed7aa;/* ขอบส้มอ่อน */
        --tech-navy: #0f172a;         /* สีกรมท่าช่างเข้ม */
        --tech-slate: #1e293b;        /* พื้นหลังส่วนหัว */
        --tech-card: #ffffff;         /* พื้นการ์ดสีขาว */
        --tech-bg: #f8fafc;           /* พื้นหลังหน้าจอ */
        --tech-text-main: #0f172a;    /* ข้อความหลัก ชัดเจน คอนทราสต์สูง */
        --tech-text-muted: #475569;   /* ข้อความรอง ขนาด 15-16px */
        --tech-border: #e2e8f0;       /* เส้นแบ่งบางตา */
        --tech-blue: #0284c7;         /* สีฟ้าสำหรับโทรหาลูกค้า */
        --tech-blue-bg: #f0f9ff;
        --tech-blue-border: #bae6fd;
        --tech-green: #15803d;        /* สีเขียวสถานะเสร็จสิ้น */
        --tech-green-bg: #f0fdf4;
        --tech-green-border: #bbf7d0;
        --tech-amber: #b45309;        /* สีเหลืองอำพันงานรอตรวจ */
        --tech-amber-bg: #fefce8;
        --tech-amber-border: #fef08a;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #cbd5e1;
        font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--tech-text-main);
        -webkit-tap-highlight-color: transparent;
        font-size: 16px;
        line-height: 1.45;
      }

      .tech-container {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--tech-bg);
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 25px rgba(0,0,0,0.12);
        position: relative;
      }

      /* -----------------------------------------------------------------------
         ส่วนหัวของแอป (App Bar Header) — ธีมส้มช่าง + กรมท่า
         ----------------------------------------------------------------------- */
      .tech-app-bar {
        background: linear-gradient(135deg, var(--tech-navy) 0%, var(--tech-slate) 100%);
        color: #fff;
        padding: 10px 12px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
      }

      .tech-header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .tech-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tech-brand-logo {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #f97316, var(--tech-primary));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 2px 8px rgba(234, 88, 12, 0.4);
      }

      .tech-brand-title {
        font-size: 17px;
        font-weight: 800;
        color: #fff;
        line-height: 1.2;
      }

      .tech-brand-badge {
        font-size: 12px;
        color: #fdba74;
        font-weight: 700;
      }

      .tech-link-btn {
        color: #cbd5e1;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        transition: all 0.15s;
        white-space: nowrap;
      }

      .tech-link-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      /* การ์ดประจำตัวช่างในส่วนหัว */
      .tech-profile-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 8px 10px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .tech-profile-info {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .tech-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f97316, #ea580c);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        border: 2px solid #fff;
        flex-shrink: 0;
      }

      .tech-name {
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tech-meta {
        font-size: 13px;
        color: #cbd5e1;
        margin-top: 1px;
      }

      .tech-actions-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;
      }

      .tech-rating-pill {
        background: rgba(245, 158, 11, 0.25);
        color: #fde047;
        border: 1px solid rgba(245, 158, 11, 0.5);
        padding: 1px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 800;
      }

      .btn-switch-tech {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
      }

      .btn-switch-tech:hover {
        background: var(--tech-primary);
        border-color: var(--tech-primary);
      }

      /* -----------------------------------------------------------------------
         แถบแท็บ 3 เรื่องหลัก (Senior-First Tabs) — ขนาดใหญ่ ตัวหนังสือชัด
         ----------------------------------------------------------------------- */
      .tech-tabs {
        display: flex;
        background: #fff;
        border-bottom: 2px solid var(--tech-border);
        position: sticky;
        top: 116px;
        z-index: 90;
      }

      .tech-tab {
        flex: 1;
        padding: 12px 4px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--tech-text-muted);
        background: none;
        border: none;
        border-bottom: 3.5px solid transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s;
        font-family: inherit;
      }

      .tech-tab.active {
        color: var(--tech-primary-dark);
        border-bottom-color: var(--tech-primary);
        background: var(--tech-primary-light);
      }

      .tech-tab-badge {
        font-size: 13px;
        background: #e2e8f0;
        color: #475569;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 800;
        min-width: 22px;
      }

      .tech-tab.active .tech-tab-badge {
        background: var(--tech-primary);
        color: #fff;
      }

      /* -----------------------------------------------------------------------
         เนื้อหาฟีดงาน (Main Feed)
         ----------------------------------------------------------------------- */
      .tech-feed {
        padding: 14px 14px 60px;
        flex: 1;
      }

      /* การ์ดงานซ่อม (Clean & Frameless Card) */
      .tech-job-card {
        background: #fff;
        border-radius: 16px;
        border: 1.5px solid var(--tech-border);
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
        margin-bottom: 16px;
        overflow: hidden;
      }

      .job-header {
        padding: 12px 16px;
        background: #f8fafc;
        border-bottom: 1px solid var(--tech-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .job-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--tech-navy);
      }

      .job-status-badge {
        font-size: 13px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 14px;
      }

      .status-assigned {
        background: #fef3c7;
        color: #b45309;
        border: 1px solid #fde68a;
      }

      .status-traveling {
        background: #ffedd5;
        color: #c2410c;
        border: 1px solid #fed7aa;
      }

      .status-in-progress {
        background: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
      }

      .status-submitted {
        background: var(--tech-amber-bg);
        color: var(--tech-amber);
        border: 1px solid var(--tech-amber-border);
      }

      .status-completed {
        background: var(--tech-green-bg);
        color: var(--tech-green);
        border: 1px solid var(--tech-green-border);
      }

      .job-body {
        padding: 16px;
      }

      /* ชื่องานใหญ่ ชัดเจน ไม่เวิ่นเว้อ */
      .job-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--tech-navy);
        margin-bottom: 14px;
        line-height: 1.35;
      }

      /* ตารางข้อมูลงาน 2 คอลัมน์ — ภาษาตรงกับจอลูกค้า 100% */
      .job-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .job-info-item {
        background: #f8fafc;
        border: 1px solid #f1f5f9;
        padding: 10px 12px;
        border-radius: 10px;
      }

      .job-info-label {
        color: var(--tech-text-muted);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 3px;
      }

      .job-info-value {
        font-weight: 800;
        color: var(--tech-text-main);
        font-size: 17px;
      }

      .job-price-value {
        color: var(--tech-primary);
        font-size: 21px;
        font-weight: 800;
      }

      /* แถวที่อยู่หน้างาน + ปุ่มนำทาง */
      .job-location-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .job-location-text {
        font-size: 15px;
        color: var(--tech-text-main);
        font-weight: 600;
        flex: 1;
      }

      .btn-tech-nav {
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        background: #0284c7;
        padding: 8px 14px;
        border-radius: 8px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .btn-tech-call {
        color: #0284c7;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* -----------------------------------------------------------------------
         ปุ่มปฏิบัติการช่าง (Tap Targets 54px สำหรับคนทำงาน)
         ----------------------------------------------------------------------- */
      .job-actions {
        border-top: 1px solid #f1f5f9;
        padding-top: 14px;
      }

      .btn-tech-action {
        width: 100%;
        min-height: 54px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        font-family: inherit;
        transition: all 0.15s;
        box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
      }

      .btn-tech-action:active {
        transform: scale(0.98);
      }

      .btn-tech-orange {
        background: linear-gradient(135deg, #f97316 0%, var(--tech-primary) 100%);
        color: #fff;
      }

      .btn-tech-orange:hover {
        background: linear-gradient(135deg, var(--tech-primary) 0%, var(--tech-primary-dark) 100%);
      }

      /* กล่องถ่ายรูปส่งงาน */
      .submit-form-card {
        background: #fff7ed;
        border: 1.5px solid var(--tech-primary-border);
        border-radius: 14px;
        padding: 14px;
        margin-top: 12px;
      }

      .submit-form-title {
        font-size: 17px;
        font-weight: 800;
        color: var(--tech-primary-dark);
        margin-bottom: 12px;
      }

      .photo-upload-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      .photo-upload-box {
        background: #fff;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        position: relative;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .photo-upload-box.has-photo {
        border-style: solid;
        border-color: var(--tech-primary);
        background: #fffaf0;
      }

      .photo-preview-img {
        max-width: 100%;
        max-height: 95px;
        border-radius: 8px;
        object-fit: cover;
      }

      .photo-upload-label {
        font-size: 15px;
        font-weight: 700;
        color: var(--tech-navy);
        margin-bottom: 6px;
      }

      .file-input-hidden {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .btn-mock-photo {
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        margin-top: 6px;
        cursor: pointer;
        font-family: inherit;
      }

      .tech-notes-input {
        width: 100%;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 15px;
        font-family: inherit;
        resize: vertical;
        min-height: 70px;
        margin-bottom: 14px;
        color: var(--tech-navy);
      }

      .tech-notes-input:focus {
        outline: none;
        border-color: var(--tech-primary);
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
      }

      /* แถบแจ้งสถานะแบบประโยคเดียวจบในตัว (Zero Redundancy) */
      .tech-alert-card {
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        text-align: center;
      }

      .tech-alert-card.warning {
        background: var(--tech-amber-bg);
        border: 1.5px solid var(--tech-amber-border);
        color: var(--tech-amber);
      }

      .tech-alert-card.success {
        background: var(--tech-green-bg);
        border: 1.5px solid var(--tech-green-border);
        color: var(--tech-green);
      }

      /* หน้าจอว่างเปล่า (Empty State) — ข้อความเดียวจบ */
      .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--tech-text-muted);
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .empty-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--tech-navy);
      }

      /* -----------------------------------------------------------------------
         โมดอลสลับชื่อช่าง 15 ท่าน (Pure Thai)
         ----------------------------------------------------------------------- */
      .tech-modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }

      .tech-modal-box {
        background: #fff;
        border-radius: 20px;
        width: 100%;
        max-width: 440px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      .tech-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 10px;
      }

      .tech-modal-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--tech-navy);
      }

      .tech-select-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1.5px solid var(--tech-border);
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .tech-select-item:hover, .tech-select-item.selected {
        background: var(--tech-primary-light);
        border-color: var(--tech-primary);
      }

      .tech-select-name {
        font-size: 17px;
        font-weight: 800;
        color: var(--tech-navy);
      }

      .tech-select-sub {
        font-size: 14px;
        color: var(--tech-text-muted);
        margin-top: 2px;
      }

      /* Toast Notification */
      .toast-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        pointer-events: none;
      }

      .toast {
        background: var(--tech-navy);
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 10px;
        border-left: 4px solid var(--tech-primary);
        animation: toastIn 0.25s ease;
      }

      @keyframes toastIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="tech-container">
      
      <!-- ส่วนหัวของแอป (App Bar Header) -->
      <header class="tech-app-bar">
        <div class="tech-header-top">
          <div class="tech-brand">
            <div class="tech-brand-logo">🔧</div>
            <div>
              <div class="tech-brand-title">รักบ้าน ช่างมืออาชีพ</div>
              <div class="tech-brand-badge">เชียงใหม่</div>
            </div>
          </div>
          <div>
            <a href="/" target="_blank" class="tech-link-btn">
              ศูนย์กลาง ↗
            </a>
          </div>
        </div>

        <!-- กล่องข้อมูลช่าง -->
        <div id="tech-profile-slot" class="tech-profile-card">
          <div style="font-size: 15px; color: #cbd5e1;">กำลังโหลดข้อมูลช่าง...</div>
        </div>
      </header>

      <!-- แถบ 3 แท็บหลัก (จบในหน้าจอ ไม่ฟุ่มเฟือย) -->
      <nav class="tech-tabs">
        <button class="tech-tab active" data-tab="active">
          <span>งานที่ต้องทำ</span>
          <span class="tech-tab-badge" id="tab-count-active">0</span>
        </button>
        <button class="tech-tab" data-tab="submitted">
          <span>รอตรวจงาน</span>
          <span class="tech-tab-badge" id="tab-count-submitted">0</span>
        </button>
        <button class="tech-tab" data-tab="completed">
          <span>งานเสร็จแล้ว</span>
          <span class="tech-tab-badge" id="tab-count-completed">0</span>
        </button>
      </nav>

      <!-- ฟีดรายการงาน -->
      <main class="tech-feed" id="tech-jobs-feed">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-title">กำลังเชื่อมต่อข้อมูลคิวงาน...</div>
        </div>
      </main>

      <!-- แจ้งเตือนข้อความสถานะ -->
      <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- โมดอลสลับชื่อช่าง -->
    <div id="tech-login-modal-container"></div>

    <script type="module" src="/src/tech.js"></script>
  </body>
</html>
